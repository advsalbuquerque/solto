<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#16302B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solto">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Solto — mobilidade dinâmica</title>
<style>
/* VOICE: treinador calmo e direto · IDEA: caderno de treino de quem pratica no chão de casa
   PICTURE: anel do cronômetro e trilhas de progressão · COLOUR: verde-pinho, areia, laranja-brasa
   TYPE: sans arredondada do sistema · LAYOUT: coluna única de celular, abas embaixo */
:root{
  --c-bg:#F5F1E8; --c-surface:#FFFDF8; --c-ink:#16302B; --c-ink-2:#4A5D57; --c-muted:#7D8A83;
  --c-line:#E4DDCF; --c-brand:#16302B; --c-accent:#E8673C; --c-accent-ink:#FFFFFF; --c-ok:#2F8F5B; --c-soft:#EAE3D3; --c-warn:#B4531F;
  --c-heat-0:#E9E3D6; --c-heat-1:#BFD5C6; --c-heat-2:#6FA587; --c-heat-3:#2F7552;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --f-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-xs:13px; --t-s:14px; --t-m:16px; --t-l:20px; --t-xl:26px; --t-xxl:34px; --t-timer:64px;
  --shadow: 0 1px 2px rgba(22,48,43,.06), 0 6px 20px rgba(22,48,43,.06);
  --nav-h:64px; --max:560px;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--f-sans);font-size:var(--t-m);-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--c-accent);outline-offset:2px;border-radius:6px}
.app{max-width:var(--max);margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + var(--s-4)) var(--s-4) calc(var(--nav-h) + var(--s-6) + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:var(--t-xxl);line-height:1.1}
h2{font-size:var(--t-xl);line-height:1.15}
h3{font-size:var(--t-l)}
p{line-height:1.5;margin:0}
.muted{color:var(--c-ink-2)}
.small{font-size:var(--t-s)}
.xs{font-size:var(--t-xs)}
.stack>*+*{margin-top:var(--s-4)}
.stack-s>*+*{margin-top:var(--s-2)}
.stack-l>*+*{margin-top:var(--s-6)}
.row{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.between{justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;padding:var(--s-2) 0 var(--s-4)}
.logo{font-family:var(--f-display);font-weight:800;font-size:var(--t-l);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--c-accent);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--c-bg)}
.back{background:none;border:0;padding:var(--s-2);margin-left:calc(-1 * var(--s-2));display:flex;align-items:center;gap:6px;color:var(--c-ink-2);min-height:44px}
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-l);padding:var(--s-5);box-shadow:var(--shadow)}
.card.dark{background:var(--c-brand);color:#F5F1E8;border-color:transparent}
.card.dark .muted{color:#BCCBC4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-pill);padding:12px 20px;font-weight:700;font-size:var(--t-m);text-decoration:none;min-height:48px;text-align:center}
.btn.primary{background:var(--c-accent);color:var(--c-accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--c-line);color:var(--c-ink)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:var(--t-s)}
.card.dark .btn.ghost{border-color:#3C5A53;color:#F5F1E8}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:var(--s-2);overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1.5px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-pill);padding:10px 14px;font-size:var(--t-s);white-space:nowrap;min-height:44px}
.chip[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg);border-color:var(--c-ink)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-4)}
.prog{display:block;text-decoration:none;border-radius:var(--r-l);overflow:hidden;background:var(--c-surface);border:1px solid var(--c-line);box-shadow:var(--shadow)}
.cover{height:110px;position:relative;overflow:hidden}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .tag{position:absolute;left:12px;top:12px;background:rgba(255,253,248,.92);color:var(--c-ink);border-radius:var(--r-pill);padding:4px 10px;font-size:var(--t-xs);font-weight:700}
.prog .body{padding:var(--s-4) var(--s-5) var(--s-5)}
.bar{height:6px;background:var(--c-soft);border-radius:var(--r-pill);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c-ok);border-radius:var(--r-pill)}
.lesson{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4);border-radius:var(--r-m);background:var(--c-surface);border:1px solid var(--c-line);text-decoration:none;width:100%;text-align:left}
.lesson[aria-disabled="true"]{opacity:.55}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--c-soft);flex:none;font-size:var(--t-s)}
.num.done{background:var(--c-ok);color:#fff}
.num.cur{background:var(--c-accent);color:#fff}
.num.lock{background:transparent;border:1.5px dashed var(--c-muted);color:var(--c-muted)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list>*+*{margin-top:var(--s-2)}
.ex{display:flex;gap:var(--s-3);padding:var(--s-3) 0;border-bottom:1px solid var(--c-line)}
.ex:last-child{border-bottom:0}
.ex .d{font-variant-numeric:tabular-nums;color:var(--c-ink-2);font-size:var(--t-s);flex:none;min-width:64px;text-align:right;white-space:nowrap}
.seg{display:flex;background:var(--c-soft);border-radius:var(--r-pill);padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:var(--r-pill);padding:10px 8px;font-size:var(--t-s);font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--c-surface);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3)}
.stat{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-m);padding:var(--s-4) var(--s-2);text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:var(--t-xl);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--c-heat-0)}
.heat i.l1{background:var(--c-heat-1)}.heat i.l2{background:var(--c-heat-2)}.heat i.l3{background:var(--c-heat-3)}
.heat i.today{outline:2px solid var(--c-accent);outline-offset:1px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week a,.week div{text-decoration:none;text-align:center;border-radius:var(--r-m);padding:8px 2px;background:var(--c-surface);border:1px solid var(--c-line);font-size:var(--t-xs)}
.week .d{font-weight:800;font-size:var(--t-m);display:block}
.week .on{border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent) inset}
.week .ok{background:#E3EFE7;border-color:#BFD5C6}
.week .rest{opacity:.6}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);backdrop-filter:blur(10px);border-top:1px solid var(--c-line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:var(--max)}
.nav li{flex:1}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;height:var(--nav-h);font-size:11px;text-decoration:none;color:var(--c-muted);font-weight:600}
.nav a[aria-current="page"]{color:var(--c-ink)}
.nav svg{width:24px;height:24px}
.field{display:block}
.field>span{display:block;font-size:var(--t-s);font-weight:600;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-s);padding:12px;font:inherit;font-size:16px;color:var(--c-ink);min-height:48px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-3)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);padding:var(--s-3) 0;border-bottom:1px solid var(--c-line);min-height:52px}
.switch:last-child{border-bottom:0}
.switch input{width:24px;height:24px;accent-color:var(--c-accent);flex:none}
.empty{text-align:center;padding:var(--s-6) var(--s-4);color:var(--c-ink-2)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--c-ink);color:var(--c-bg);padding:12px 18px;border-radius:var(--r-pill);font-size:var(--t-s);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.notice{background:var(--c-soft);border-radius:var(--r-m);padding:var(--s-3) var(--s-4);font-size:var(--t-s);color:var(--c-ink-2);line-height:1.5}
.notice.warn{background:#FBE7DC;color:#7A3412}
.pill{display:inline-block;background:var(--c-soft);border-radius:var(--r-pill);padding:3px 10px;font-size:var(--t-xs);font-weight:700;white-space:nowrap}
.pill.acc{background:var(--c-accent);color:#fff}
.pill.ok{background:var(--c-ok);color:#fff}
.dlg{position:fixed;inset:0;background:rgba(22,48,43,.55);z-index:30;display:grid;place-items:center;padding:var(--s-5)}.dlg[hidden]{display:none}.dlg .card{max-width:360px;width:100%;color:var(--c-ink)}.dlg .row{justify-content:flex-end}
details.art{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-m);padding:0 var(--s-4)}
details.art summary{cursor:pointer;font-weight:700;padding:var(--s-4) 0;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:44px}
details.art summary::after{content:"+";font-weight:800;color:var(--c-accent)}
details.art[open] summary::after{content:"–"}
details.art .in{padding-bottom:var(--s-4)}
details.art ul{margin:0;padding-left:20px}
details.art li{line-height:1.5;margin:6px 0}
.big{font-family:var(--f-display);font-size:clamp(32px,9vw,44px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.macro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3);text-align:center}
.macro b{display:block;font-family:var(--f-display);font-size:var(--t-l)}
.chart{position:relative;height:180px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hab{display:flex;align-items:center;gap:var(--s-3);padding:10px 0;border-bottom:1px solid var(--c-line);min-height:52px;cursor:pointer}
.hab:last-child{border-bottom:0}
.hab input{width:24px;height:24px;accent-color:var(--c-ok);flex:none}
.trail{position:relative;padding-left:8px}
.trail::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:var(--c-line)}
.trail .lesson{position:relative;background:transparent;border:0;padding:10px 0}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-m);padding:16px;font-weight:600;min-height:56px}
.qopt[aria-pressed="true"]{border-color:var(--c-accent);background:#FCE9E1}
.qopt small{display:block;font-weight:400;color:var(--c-ink-2);margin-top:4px}
.qbar{height:4px;background:var(--c-soft);border-radius:2px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--c-accent)}
.search{width:100%;border:1.5px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-pill);padding:12px 18px;font:inherit;font-size:16px;min-height:48px}
/* player */
.player{position:fixed;inset:0;background:var(--c-brand);color:#F5F1E8;z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + var(--s-4)) var(--s-5) calc(env(safe-area-inset-bottom) + var(--s-5));overflow-y:auto}
.player .wrap{max-width:var(--max);width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}
.player .muted{color:#BCCBC4}
.player .ring{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:var(--s-4) auto}
.player .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.player .ring .time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:var(--t-timer);font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.player .ring .time small{display:block;font-size:var(--t-s);font-weight:600;color:#BCCBC4;margin-top:6px}
.player .side{display:inline-block;background:var(--c-accent);color:#fff;border-radius:var(--r-pill);padding:4px 12px;font-size:var(--t-s);font-weight:700}
.player .cue{font-size:var(--t-m);line-height:1.5}
.player .ctrls{display:flex;justify-content:center;align-items:center;gap:var(--s-5);margin-top:auto;padding-top:var(--s-4)}
.round{width:56px;height:56px;border-radius:50%;border:1.5px solid #3C5A53;background:transparent;color:#F5F1E8;display:grid;place-items:center;flex:none}
.round.big{width:80px;height:80px;background:var(--c-accent);border-color:transparent}
.round svg{width:26px;height:26px}
.stepper{display:flex;align-items:center;justify-content:center;gap:var(--s-5);margin:var(--s-4) 0}
.stepper output{font-family:var(--f-display);font-size:var(--t-timer);font-weight:800;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:3px;margin-top:var(--s-3)}
.steps i{flex:1;height:4px;border-radius:2px;background:#3C5A53}
.steps i.on{background:#F5F1E8}
.steps i.cur{background:var(--c-accent)}
.feel{display:flex;gap:var(--s-2)}
.feel button{flex:1;border:1.5px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-m);padding:12px 0;font-size:22px;min-height:52px}
.feel button[aria-pressed="true"]{border-color:var(--c-accent);background:#FCE9E1}
@media (min-width:720px){ .grid{grid-template-columns:1fr 1fr} }
@media (max-width:360px){ .fields{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
"use strict";
/* ================= EXERCÍCIOS (conteúdo próprio) ================= */
// t: mob (mobilidade), for (força), car (condicionamento). p: progressões por nível (opcional). m: músculos.
const EX = {
  resp:{t:"mob",n:"Respiração de chegada",cue:"Em pé ou sentado, inspire pelo nariz expandindo as costelas e solte o ar devagar pela boca.",p:["Só respire.","Pause 2 s com o ar cheio.","Pause 2 s cheio e 2 s vazio."]},
  tornoz:{t:"mob",n:"Círculos de tornozelo",cue:"Apoie a ponta do pé no chão e desenhe círculos grandes com o tornozelo, nos dois sentidos.",p:["Segure numa parede.","Sem apoio.","Pé no ar, círculos lentos."]},
  pontape:{t:"mob",n:"Ponta e calcanhar",cue:"Suba na ponta dos pés e depois volte apoiando nos calcanhares, levantando as pontas.",p:["Com apoio na parede.","Sem apoio.","Pausa de 2 s em cima."]},
  joelho:{t:"mob",n:"Joelho à frente na parede",cue:"Pé a um palmo da parede: leve o joelho para tocar a parede sem tirar o calcanhar do chão.",p:["Pé bem perto.","Um palmo.","Afaste o pé a cada 3 toques."]},
  quadcir:{t:"mob",n:"Círculos de quadril em pé",cue:"Mãos na cintura, desenhe círculos amplos com a pelve, como se mexesse um bambolê.",p:["Círculos pequenos.","Círculos amplos.","Amplos e devagar, 6 s por volta."]},
  cars_q:{t:"mob",n:"Rotação controlada do quadril",cue:"Em apoio numa perna, suba o joelho, abra para o lado e leve para trás, girando o quadril no máximo que controla.",p:["Segure numa cadeira.","Toque leve na parede.","Sem apoio."]},
  agach:{t:"mob",n:"Agachamento profundo com respiro",cue:"Desça até onde conseguir com calcanhares no chão, cotovelos empurrando os joelhos para fora. Respire lá embaixo.",p:["Segure numa porta.","Livre.","Livre, com braços estendidos à frente."]},
  agachrot:{t:"mob",n:"Agachamento com giro",cue:"Lá embaixo, estenda um braço para o teto girando o tronco. Alterne os lados.",p:["Mão de apoio no chão.","Giro completo.","Giro com pausa de 2 s."]},
  avanco:{t:"mob",n:"Avanço com braço para o alto",cue:"Dê um passo grande à frente, desça o joelho de trás e estenda os braços para cima, abrindo a frente do quadril.",p:["Joelho de trás no chão.","Joelho perto do chão.","Pausa e inclinação lateral."]},
  punho:{t:"mob",n:"Punhos em quatro apoios",cue:"Mãos no chão, balance o peso para frente, para trás e em círculos sobre os punhos.",p:["Peso leve.","Peso médio.","Dedos virados para os joelhos."]},
  ombcir:{t:"mob",n:"Círculos de ombro com braço estendido",cue:"Braço esticado, desenhe o maior círculo possível sem girar o tronco. Devagar.",p:["Círculos médios.","Máximo controlado.","Com o punho fechado e força no braço."]},

function nutrition(){
  const n=S.nutri,pr=P0();if(!n.peso||!n.altura||!n.idade||!n.sexo)return null;
  const tmb=10*n.peso+6.25*n.altura-5*n.idade+(n.sexo==="m"?5:-161);
  const af={sed:1.2,leve:1.375,mod:1.55,alto:1.725}[n.atv||"leve"];const get=tmb*af;
  const imc=n.peso/((n.altura/100)**2);let goal=pr.goal,warn="";
  let kcal=get;if(goal==="definicao"){kcal=Math.max(get*0.82,tmb);}else if(goal==="musculo"){kcal=get*1.1;}
  if(n.idade<18){kcal=get;warn="Abaixo de 18 anos o Solto não sugere déficit nem superávit calórico. Procure um nutricionista ou médico para orientar a alimentação.";}
  else if(goal==="definicao"&&imc<18.5){kcal=get;warn="Seu IMC está abaixo de 18,5. Perder peso não é recomendado agora; o Solto mostra a manutenção. Converse com um profissional.";}
  const prot=Math.round(n.peso*(goal==="mobilidade"?1.4:1.8)),fat=Math.round(n.peso*0.8),carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {tmb,get,kcal,prot,fat,carb,agua:n.peso*35,imc,warn};}

function weekStrip(){const d=new Date();d.setDate(d.getDate()-d.getDay());let h="";
  for(let k=0;k<7;k++){const x=new Date(d);x.setDate(d.getDate()+k);const key=dkey(x),t=planType(x),isT=key===today(),ok=t&&doneOn("s:"+t,key);
    const cls=[isT?"on":"",ok?"ok":"",t?"":"rest"].join(" ");const inner=`<span>${WD[x.getDay()]}</span><span class="d">${x.getDate()}</span><span>${ok?"✓":t?({forcaA:"Força",forcaB:"Força",corpo:"Força",circuito:"Circ.",mob:"Mob."}[t]):"—"}</span>`;
    h+=t?`<a class="${cls}" href="#s-${t}" aria-label="${WD[x.getDay()]}: ${SESS_NAMES[t]}">${inner}</a>`:`<div class="${cls}">${inner}</div>`;}
  return `<div class="week">${h}</div>`;}

    <p class="muted">${st>1?`<b>${st} dias</b> seguidos em movimento.`:st===1?"Primeiro dia em movimento. Continue!":"Alguns minutos hoje já contam."}</p></div>

  <label class="field"><span>Anotação (opcional)</span><textarea id="note" rows="3" placeholder="Ex.: ombro direito mais firme">${esc(r.note||"")}</textarea></label></div>
  <p class="small muted" style="text-align:center">${S.profile?nextTrainingText():""}</p>
  <button class="btn primary block" onclick="finish()">Salvar e voltar</button></div>`;}
function levelUp(c,i){S.skills[c]=i+1;save();toast(`Subiu para: ${EX[CH[c].steps[i+1][0]].n}`);render();}
function finish(){const r=window.__last;r.note=($("#note")||{}).value||"";
  (r.log||[]).forEach(x=>{S.sets.push({date:r.date,id:x.id,val:x.val,unit:x.unit});const cur=S.rec[x.id];if(!cur||x.val>cur.v)S.rec[x.id]={v:x.val,u:x.unit,date:r.date};});
  const {log,...keep}=r;S.done.push(keep);save();window.__last=null;toast(`Salvo! Sequência: ${streak()} ${plural(streak(),"dia","dias")}.`);go("#hoje");}

/* ================= AO VIVO (S07) ================= */
function nextLives(){const out=[],d=new Date();d.setHours(19,0,0,0);const plan=[[3,"Prática guiada ao vivo","Fluxo de 45 min para o corpo todo"],[6,"Plantão de dúvidas","Traga o movimento que está travando"]];
  for(let k=0;k<21&&out.length<5;k++){const x=new Date(d);x.setDate(d.getDate()+k);plan.forEach(([wd,t,s])=>{if(x.getDay()===wd){const y=new Date(x);if(wd===6)y.setHours(10,0,0,0);if(y>new Date(Date.now()-36e5))out.push({at:y,t,s});}});}return out.sort((a,b)=>a.at-b.at);}
function gcal(v){const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");const end=new Date(v.at.getTime()+45*6e4);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Solto · "+v.t)+"&dates="+f(v.at)+"/"+f(end)+"&details="+encodeURIComponent(v.s+(S.live?" — "+S.live:""));}
function S07(){const L=nextLives();
  return `${back}<div class="stack-l"><div class="stack-s"><h1>Ao vivo</h1><p class="muted">Práticas com professor toda semana e um plantão para tirar dúvidas.</p></div>

  <div class="list">${L.map((v,i)=>`<div class="card stack-s"><div class="row between"><span class="small muted">${v.at.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"})} · ${v.at.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span>${i===0?'<span class="pill acc">Próxima</span>':""}</div>
    <h3>${esc(v.t)}</h3><p class="small muted">${esc(v.s)}</p><div class="row">${S.live?`<a class="btn primary sm" href="${esc(S.live)}" target="_blank" rel="noopener">Entrar</a>`:""}<a class="btn ghost sm" href="${gcal(v)}" target="_blank" rel="noopener">Pôr na agenda</a></div></div>`).join("")}</div></div>`;}

/* ================= PROGRESSO (S08) + CORPO (S16) ================= */
function lineChart(pts,unit){if(pts.length<2)return `<p class="small muted">Registre pelo menos duas medidas para ver o gráfico.</p>`;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),pad=(mx-mn)*.15||1,lo=mn-pad,hi=mx+pad;
  const X=i=>i/(pts.length-1)*100,Y=v=>100-(v-lo)/(hi-lo)*100;
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(2)},${Y(p.v).toFixed(2)}`).join(" ");
  return `<div class="chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Gráfico de ${unit}"><path d="${d}" fill="none" stroke="#2F7552" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="1.6" fill="#E8673C" vector-effect="non-scaling-stroke"/>`).join("")}</svg></div>
  <div class="row between xs muted"><span>${fmtDate(pts[0].d)} · ${nf(pts[0].v,1)} ${unit}</span><span>${fmtDate(pts.at(-1).d)} · ${nf(pts.at(-1).v,1)} ${unit}</span></div>`;}
function S08(){const t=totals(),st=streak(),weeks=12;const counts={};S.done.forEach(d=>counts[d.date]=(counts[d.date]||0)+1);
  const end=new Date(),start=new Date(end);start.setDate(end.getDate()-(weeks*7-1)-end.getDay());
  let cells="";for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=dkey(d),c=counts[k]||0;cells+=`<i class="${c>=3?"l3":c==2?"l2":c==1?"l1":""} ${k===today()?"today":""}" title="${d.toLocaleDateString("pt-BR")}: ${c} treino(s)"></i>`;}
  const recent=[...S.done].reverse().slice(0,8),b=S.body;const last=b.at(-1),first=b[0];
  const recs=Object.entries(S.rec).sort((a,b)=>b[1].date.localeCompare(a[1].date)).slice(0,8);
  return `${brand}<div class="stack-l"><h1>Progresso</h1>
  <div class="stats"><div class="stat"><b>${st}</b><span class="xs muted">dias seguidos</span></div><div class="stat"><b>${t.days}</b><span class="xs muted">dias ativos</span></div><div class="stat"><b>${t.min}</b><span class="xs muted">minutos</span></div></div>
  <a class="card stack-s" href="#corpo" style="text-decoration:none;display:block"><div class="row between"><h3>Corpo</h3><span class="small">Registrar ›</span></div>
   ${last?`<p class="muted small">Peso ${nf(last.peso,1)} kg${last.cintura?` · cintura ${nf(last.cintura,1)} cm`:""}${first&&first!==last&&first.peso&&last.peso?` · ${last.peso-first.peso>0?"+":""}${nf(last.peso-first.peso,1)} kg desde ${fmtDate(first.date)}`:""}</p>`:`<p class="muted small">Registre peso e medidas para acompanhar a definição.</p>`}</a>
  <section class="card stack" aria-label="Últimas 12 semanas"><h3>Últimas 12 semanas</h3><div class="heat">${cells}</div></section>
  <section class="card stack-s"><h3>Recordes</h3>${recs.length?recs.map(([id,r])=>`<div class="ex"><div style="flex:1"><b>${esc(EX[id]?EX[id].n:id)}</b><p class="small muted">${fmtDate(r.date)}</p></div><div class="d">${r.v}${r.u==="s"?" s":" reps"}</div></div>`).join(""):`<p class="small muted">Faça um treino de força para registrar seus primeiros recordes.</p>`}</section>
  <section class="stack"><h3>Trilhas</h3><div class="list">${["push",pullKey(),"legs","post","core","hand"].map(c=>{const i=stepOf(c),n=CH[c].steps.length;return `<a class="lesson" href="#k-${c}"><span class="t"><b>${CH[c].n}</b><span class="bar" style="margin-top:8px"><i style="width:${(i+1)/n*100}%"></i></span></span><span class="small muted">${i+1}/${n}</span></a>`}).join("")}</div></section>
  <section class="stack"><h3>Histórico</h3>${recent.length?`<div class="card">${recent.map(r=>`<div class="ex"><div style="flex:1"><b>${esc(r.title||(prog(r.p)?prog(r.p).lessons[r.n].t:"Treino"))}</b><p class="small muted">${fmtDate(r.date,{day:"2-digit",month:"2-digit",year:"numeric"})} · ${fmtMin(r.sec)}${r.feel?" · "+["😣","😕","🙂","😊","🤩"][r.feel-1]:""}${r.note?" · "+esc(r.note):""}</p></div></div>`).join("")}</div>`
    :`<div class="empty card stack"><p>Nenhum treino ainda.</p><a class="btn primary" href="#treinos">Escolher um treino</a></div>`}</section></div>`;}
function S16(){const b=S.body;const ptsW=b.filter(x=>x.peso).map(x=>({d:x.date,v:x.peso})),ptsC=b.filter(x=>x.cintura).map(x=>({d:x.date,v:x.cintura}));
  return `${back}<div class="stack-l"><div class="stack-s"><h1>Corpo</h1><p class="muted">Meça de manhã, em jejum, uma vez por semana. A cintura mostra a definição melhor que a balança.</p></div>
  <form class="card stack" onsubmit="event.preventDefault();addBody()"><div class="fields">
   <label class="field"><span>Peso (kg)</span><input id="b-peso" type="number" step="0.1" min="25" max="300" inputmode="decimal" required></label>
   <label class="field"><span>Cintura (cm)</span><input id="b-cintura" type="number" step="0.1" min="40" max="200" inputmode="decimal" placeholder="na altura do umbigo"></label>
   <label class="field"><span>Quadril (cm)</span><input id="b-quadril" type="number" step="0.1" min="40" max="200" inputmode="decimal"></label>
   <label class="field"><span>Braço (cm)</span><input id="b-braco" type="number" step="0.1" min="15" max="70" inputmode="decimal" placeholder="contraído"></label>
   <label class="field"><span>Peito (cm)</span><input id="b-peito" type="number" step="0.1" min="50" max="200" inputmode="decimal"></label>
   <label class="field"><span>Coxa (cm)</span><input id="b-coxa" type="number" step="0.1" min="25" max="100" inputmode="decimal"></label></div>
   <button class="btn primary block" type="submit">Registrar hoje</button></form>
  <section class="card stack-s"><h3>Peso</h3>${lineChart(ptsW,"kg")}</section>
  <section class="card stack-s"><h3>Cintura</h3>${lineChart(ptsC,"cm")}</section>
  ${b.length?`<section class="card"><h3>Registros</h3>${[...b].reverse().map((x,ri)=>`<div class="ex"><div style="flex:1"><b>${fmtDate(x.date,{day:"2-digit",month:"2-digit",year:"numeric"})}</b><p class="small muted">${["peso","cintura","quadril","braco","peito","coxa"].filter(k=>x[k]).map(k=>`${({peso:"peso",cintura:"cintura",quadril:"quadril",braco:"braço",peito:"peito",coxa:"coxa"})[k]} ${nf(x[k],1)}${k==="peso"?" kg":" cm"}`).join(" · ")}</p></div><button class="btn ghost sm" onclick="ask('Apagar o registro de ${fmtDate(x.date)}?',()=>{S.body.splice(${b.length-1-ri},1);save();render()})">Apagar</button></div>`).join("")}</section>`:""}</div>`;}
function addBody(){const g=k=>{const v=parseFloat(($("#b-"+k)||{}).value);return isFinite(v)?v:null;};const e={date:today()};["peso","cintura","quadril","braco","peito","coxa"].forEach(k=>{const v=g(k);if(v)e[k]=v;});
  if(!e.peso){toast("Informe o peso.");return;}S.body=S.body.filter(x=>x.date!==e.date);S.body.push(e);S.body.sort((a,b)=>a.date.localeCompare(b.date));save();toast("Medidas registradas.");render();}

function saveNutri(){const v=id=>$("#n-"+id).value;S.nutri={sexo:v("sexo"),idade:+v("idade")||null,altura:+v("altura")||null,peso:+v("peso")||null,atv:v("atv")};

/* ================= GUIA (S17) ================= */
const GUIDE=[
 ["Como o Solto funciona",["O plano semanal mistura força, mobilidade e, se o objetivo pede, circuito.","Cada exercício de força faz parte de uma trilha. Você começa no passo do seu teste de nível.","Bateu a meta em todas as séries? A tela final oferece subir de passo. Ficou pesado? Volte um passo na trilha.","A intensidade da mobilidade (básico, intermediário, avançado) muda o tempo de cada exercício e a forma de fazer."]],
 ["Mobilidade: amplitude com controle",["Mobilidade é conseguir chegar numa posição e ter força lá dentro. Alongar sozinho dá amplitude; mexer com controle ensina o corpo a usar essa amplitude.","Antes do treino: movimentos dinâmicos (círculos, ondas, giros). Depois ou em outro horário: posições paradas de 30 a 60 s.","Pouco e sempre rende mais: 5 a 10 minutos por dia valem mais que uma hora por semana.","Desconforto de alongamento é aceitável; dor pontual, choque ou formigamento não."]],
 ["Ganhar músculo com o peso do corpo",["O músculo cresce quando a série chega perto do limite: termine com 1 a 3 repetições sobrando, com boa técnica.","Faixa útil: de 6 a 30 repetições por série. Passou de 20 a 25 com folga? Hora de subir para a variação mais difícil da trilha.","Volume: comece com cerca de 10 séries por semana para cada grupo muscular e suba aos poucos até 15 a 20, se a recuperação permitir.","Descanse de 1 a 3 minutos entre séries de força. Desça devagar (2 a 3 s) e suba firme.","Proteína de 1,6 a 2,2 g por kg de peso por dia, dividida em 3 a 5 refeições.","Resultado visível leva de 8 a 12 semanas de constância."]],
 ["Definição: perder gordura sem perder músculo",["Definição é baixar gordura mantendo o músculo. O treino de força segura o músculo; a alimentação faz a gordura sair.","Use um déficit moderado, de 10 a 20% abaixo do gasto. Cortes grandes derrubam a força, a disposição e o músculo.","Ritmo saudável: perder de 0,5 a 1% do peso por semana.","Mantenha a proteína alta (cerca de 1,8 a 2,2 g/kg) e o treino de força pesado para o seu nível.","Ande: 7 a 10 mil passos por dia gastam mais que muita sessão de cardio.","Acompanhe a cintura e fotos, não só a balança. O peso varia 1 a 2 kg com água, sal e intestino."]],
 ["Recuperação e sono",["Dormir 7 a 9 horas é parte do treino: é dormindo que o músculo se reconstrói.","Dor muscular de 24 a 72 horas depois de um treino novo é normal e diminui com a repetição.","Nos dias de descanso, mobilidade leve e caminhada ajudam a recuperar.","Se a força cai por mais de uma semana, durma mais, coma mais ou tire 3 a 5 dias mais leves."]],
 ["Técnica e respiração",["Coluna longa e neutra na maioria dos exercícios: nem curvada, nem arqueada demais.","Expire no esforço e inspire na volta. Em pranchas e canoas, respire curto sem soltar o abdômen.","Prefira menos repetições bem feitas a muitas tortas. A repetição que conta é a que você controla.","Grave um vídeo de lado de vez em quando para conferir a postura."]],
 ["Sinais de alerta",["Pare na hora se sentir dor no peito, falta de ar fora do normal, tontura, desmaio ou palpitação, e procure atendimento.","Dor aguda na articulação, estalo com dor, inchaço ou formigamento que não passa: pare e procure um fisioterapeuta ou médico.","Gestantes, pessoas com doença do coração, pressão alta descontrolada, cirurgia recente ou lesão em tratamento precisam de liberação profissional antes.","O Solto orienta, mas não substitui avaliação individual."]],
 ["Glossário",["Série: um bloco de repetições seguidas. Repetição: um movimento completo.","Meta: o número que libera o próximo passo da trilha.","Reserva: quantas repetições ainda sobravam ao parar a série.","Isometria: segurar uma posição parada, como a prancha.","Unilateral: exercício feito com uma perna ou um braço por vez.","Déficit calórico: comer menos do que gasta. Superávit: comer mais."]]];
const NUTRI_ART=[
 ["Ideias de refeição",["Café: ovos mexidos com cuscuz ou pão, fruta. Ou iogurte natural com aveia e banana.","Almoço e jantar: arroz, feijão, uma proteína (frango, peixe, carne magra, ovo) e salada à vontade.","Lanches: fruta com castanhas, iogurte, queijo branco, ovo cozido, tapioca com frango.","Depois do treino não precisa de nada especial: a próxima refeição normal com proteína resolve."]],
 ["Erros comuns na definição",["Cortar demais: fome, sono ruim e perda de músculo. Melhor um déficit que dá para manter por meses.","Beber calorias: refrigerante, suco adoçado e álcool somam muito sem saciar.","Fim de semana sem freio pode anular o déficit da semana inteira.","Esquecer da proteína: ela segura o músculo e dá saciedade."]]];
function guideArticles(arr){return `<div class="list">${arr.map(([t,items])=>`<details class="art"><summary>${esc(t)}</summary><div class="in"><ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div></details>`).join("")}</div>`;}
function S17(){return `${brand}<div class="stack-l"><div class="stack-s"><h1>Guia</h1><p class="muted">Tudo o que você precisa saber para melhorar mobilidade, ganhar músculo e definir, em linguagem simples.</p></div>

/* ================= PLAYER (S05) ================= */
let P=null;
function speak(t){if(!S.voice||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";speechSynthesis.speak(u);}catch(e){}}
let AC=null;function beep(f=880,d=.12){if(!S.beeps)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
async function wake(on){try{if(on&&"wakeLock" in navigator){P.lock=await navigator.wakeLock.request("screen");}else if(P&&P.lock){P.lock.release();P.lock=null;}}catch(e){}}
function startPlayer(key){const l=getLesson(key);if(!l)return;$("#toast").classList.remove("on");
  P={key,title:l.t,st:steps(l),k:0,phase:"prep",left:5,dur:5,paused:false,elapsed:0,last:performance.now(),lock:null,log:[],val:0};
  const el=document.createElement("div");el.className="player";el.id="player";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Treino em andamento");
  document.body.appendChild(el);document.body.style.overflow="hidden";wake(true);announce();drawPlayer();P.raf=requestAnimationFrame(tick);document.addEventListener("keydown",keys);}
const cur=()=>P.st[P.k];
function announce(){const s=cur(),e=EX[s.id];
  if(P.phase==="prep")speak(`${P.k===0?"Vamos começar. ":"A seguir, "}${e.n}${s.side?", "+s.side.toLowerCase():""}${s.type==="set"?`. ${s.sets} séries de ${s.target}${s.unit==="s"?" segundos":""}`:""}.`);
  else if(P.phase==="work")speak(e.cue);
  else if(P.phase==="set")speak(`${s.set===1?e.n+". ":""}Série ${s.set}. ${s.unit==="s"?"Segure "+s.target+" segundos":"Meta de "+s.target+" repetições"}${s.sides===2?" de cada lado":""}.`);
  else if(P.phase==="rest")speak(`Descanse.`);}
function setPhase(ph){P.phase=ph;const s=cur();
  if(ph==="prep"){P.left=P.dur=TRANS;}
  else if(ph==="work"){P.left=P.dur=s.sec;beep(990,.2);}
  else if(ph==="set"){P.val=s.target;if(s.unit==="s"){P.left=P.dur=s.target*s.sides;}else{P.left=P.dur=0;}beep(990,.2);}
  else if(ph==="rest"){P.left=P.dur=s.rest;}
  announce();drawPlayer();}
function tick(now){if(!P)return;const dt=(now-P.last)/1000;P.last=now;
  if(!P.paused){P.elapsed+=dt;
    const timed=P.phase==="prep"||P.phase==="work"||P.phase==="rest"||(P.phase==="set"&&cur().unit==="s");
    if(timed){const b=Math.ceil(P.left);P.left-=dt;const a=Math.ceil(P.left);if(a!==b&&a<=3&&a>0)beep(660);if(P.left<=0)advance();}
    updateTime();}
  P.raf=requestAnimationFrame(tick);}
function logSet(val){const s=cur();P.log.push({id:s.id,chain:s.chain,stepIdx:s.stepIdx,target:s.target,unit:s.unit,sides:s.sides,val:Math.max(0,Math.round(val))});}
function goNext(){if(P.k>=P.st.length-1)return endPlayer(true);P.k++;setPhase("prep");}
function advance(dir){
  if(dir===-1){
    if(P.phase==="rest"){P.log.pop();setPhase("set");return;}
    if(P.phase==="work"||P.phase==="set"){if(cur().type==="set")setPhase("set");else setPhase("prep");return;}
    if(P.k>0){P.k--;setPhase(cur().type==="set"?"set":"prep");}return;}
  const s=cur();
  if(P.phase==="prep"){setPhase(s.type==="set"?"set":"work");return;}
  if(P.phase==="work"){goNext();return;}
  if(P.phase==="set"){logSet(s.unit==="s"?(P.left>0?(P.dur-P.left)/s.sides:s.target):P.val);
    if(P.k>=P.st.length-1)return endPlayer(true);setPhase("rest");return;}
  if(P.phase==="rest"){P.k++;const n=cur();setPhase(n.type==="set"?"set":"work");return;}}
function updateTime(){const t=$("#p-time"),c=$("#p-arc");if(!t||!c)return;const s=cur();
  if(P.phase==="set"&&s.unit!=="s")return;
  t.firstChild.textContent=P.phase==="prep"?Math.ceil(P.left):fmtClock(P.left);
  const C=2*Math.PI*120;c.style.strokeDashoffset=P.dur?C*(1-Math.max(0,P.left)/P.dur):0;}
function drawPlayer(){const s=cur(),e=EX[s.id],C=2*Math.PI*120;const nx=P.st[P.k+1];
  const isRep=P.phase==="set"&&s.unit!=="s";
  let head,center,body,mainBtn;
  if(P.phase==="rest"){const n=nx;head=`<p class="small muted">Descanso</p><h2>Respire e solte os braços</h2>`;
    body=n?`<p class="cue">A seguir: <b>${esc(EX[n.id].n)}</b>${n.type==="set"?` · série ${n.set} de ${n.sets}`:""}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost sm" onclick="P.left+=15;P.dur+=15">+15 s</button><button class="btn primary sm" onclick="advance()">Pular descanso</button></div>`:"";}
  else{head=`<p class="small muted">${P.phase==="prep"?(P.k===0?"Prepare-se":"A seguir"):s.type==="set"?`Série ${s.set} de ${s.sets}`:esc(P.title)}</p><h2>${esc(e.n)}</h2>${s.side?`<span class="side">${s.side}</span>`:""}${s.type==="set"&&s.sides===2?`<span class="side">cada lado</span>`:""}`;
    body=`<p class="cue">${esc(e.cue)}</p>${e.p?`<p class="small muted" style="margin-top:6px">Nível ${lvl().n.toLowerCase()}: ${esc(e.p[lvl().i])}</p>`:""}${nx&&P.phase==="work"?`<p class="xs muted" style="margin-top:8px">Depois: ${esc(EX[nx.id].n)}</p>`:""}`;}
  if(isRep){center=`<p class="small muted" style="text-align:center;margin-top:16px">Meta: ${s.target} repetições${s.sides===2?" de cada lado":""}. Quantas você fez?</p>
    <div class="stepper"><button class="round" onclick="P.val=Math.max(0,P.val-1);$('#p-val').textContent=P.val" aria-label="Menos uma">−</button><output id="p-val" aria-live="polite">${P.val}</output><button class="round" onclick="P.val++;$('#p-val').textContent=P.val" aria-label="Mais uma">+</button></div>`;
    mainBtn=`<button class="round big" onclick="advance()" aria-label="Série feita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></button>`;}
  else{center=`<div class="ring"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="none" stroke="#2C4842" stroke-width="12"/><circle id="p-arc" cx="130" cy="130" r="120" fill="none" stroke="${P.phase==="prep"||P.phase==="rest"?"#BCCBC4":"#E8673C"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="time" id="p-time">0<small>${P.phase==="set"?"segure":P.phase==="rest"?"descanso":""}</small></div></div>`;
    mainBtn=`<button class="round big" id="p-pp" onclick="togglePause()" aria-label="${P.paused?"Continuar":"Pausar"}">${P.paused?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'}</button>`;}
  if(P.phase==="set"&&s.unit==="s")body+=`<p class="xs muted" style="margin-top:8px">Se precisar parar antes, toque em pular: o Solto registra o tempo que você segurou.</p>`;
  $("#player").innerHTML=`<div class="wrap"><div class="row between"><button class="round" onclick="endPlayer(false)" aria-label="Sair do treino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span class="small muted" id="p-count">${P.k+1} de ${P.st.length}</span><span style="width:56px"></span></div>
    <div class="steps" aria-hidden="true">${P.st.map((_,k)=>`<i class="${k<P.k?"on":k===P.k?"cur":""}"></i>`).join("")}</div>
    <div style="margin-top:20px" class="stack-s">${head}</div>${center}<div>${body}</div>
    <div class="ctrls"><button class="round" onclick="advance(-1)" aria-label="Voltar etapa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>${mainBtn}
    <button class="round" onclick="advance()" aria-label="Pular etapa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></div></div>`;
  updateTime();}
function togglePause(){P.paused=!P.paused;P.last=performance.now();if(P.paused&&"speechSynthesis" in window)speechSynthesis.cancel();drawPlayer();const b=$("#p-pp");if(b)b.focus();}
function keys(ev){if(!P||!$("#dlg").hidden)return;if(ev.key===" "){ev.preventDefault();if(P.phase==="set"&&cur().unit!=="s")advance();else togglePause();}else if(ev.key==="ArrowRight")advance();else if(ev.key==="ArrowLeft")advance(-1);else if(ev.key==="Escape")endPlayer(false);
  else if(P.phase==="set"&&cur().unit!=="s"&&(ev.key==="ArrowUp"||ev.key==="ArrowDown")){ev.preventDefault();P.val=Math.max(0,P.val+(ev.key==="ArrowUp"?1:-1));$("#p-val").textContent=P.val;}}
function endPlayer(completed,sure){
  if(!completed&&!sure&&P.elapsed>20){ask("Sair agora? O treino não será marcado como feito.",()=>endPlayer(false,true));return;}
  cancelAnimationFrame(P.raf);wake(false);try{speechSynthesis.cancel();}catch(e){}document.removeEventListener("keydown",keys);$("#player").remove();document.body.style.overflow="";
  if(completed){speak("Treino concluído. Muito bem.");const l=getLesson(P.key);
    window.__last={k:P.key,p:l&&l.p?l.p.slug:undefined,n:l&&l.p?l.n:undefined,title:P.title,date:today(),sec:Math.round(P.elapsed),feel:0,note:"",log:P.log};P=null;go("#fim");}
  else{P=null;render();}}

/* ================= ROTEADOR ================= */
function render(){
  const h=location.hash.replace(/^#/,"")||"hoje";let m,html,tab="";
  if(h==="hoje"||h==="inicio"){html=S11();tab="hoje";}
  else if(h==="quiz"){html=S10();}
  else if(h==="plano"){html=S10b();tab="hoje";}
  else if(h==="treinos"||h==="programas"){html=S02();tab="treinos";}
  else if((m=h.match(/^a-(.+)-(\d+)$/))){html=S04(`p:${m[1]}:${m[2]}`);tab="treinos";}
  else if((m=h.match(/^p-(.+)$/))){html=S03(m[1]);tab="treinos";}
  else if((m=h.match(/^s-(.+)$/))){html=S04("s:"+m[1]);tab="treinos";}
  else if((m=h.match(/^k-(.+)$/))){html=S12(m[1]);tab="treinos";}
  else if(h==="biblioteca"){html=S13();tab="guia";}
  else if(h==="montar"){html=S14();tab="treinos";}
  else if(h==="fim"){html=S06();}
  else if(h==="aovivo"){html=S07();tab="treinos";}
  else if(h==="progresso"){html=S08();tab="progresso";}
  else if(h==="corpo"){html=S16();tab="progresso";}
  else if(h==="nutricao"){html=S15();tab="guia";}
  else if(h==="guia"){html=S17();tab="guia";}
  else if(h==="perfil"){html=S09();tab="perfil";}
  else html=notFound();
  if(html===undefined)return;
  $("#app").innerHTML=html;$("#nav").style.display=h==="quiz"?"none":"";
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{if(P)endPlayer(false,true);if(location.hash!=="#quiz")Q=Q&&Q.built?Q:null;if(location.hash!=="#montar")MB=MB;render();if(location.hash!==lastHash){window.scrollTo(0,0);lastHash=location.hash;}});
render();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
</script>
